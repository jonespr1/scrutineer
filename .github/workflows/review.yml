# Scrutineer - reusable AI pull-request reviewer.
#
# Self-contained: fetches the PR diff + prior review thread, sends it to your chosen
# model(s) in one call each, and posts the review(s) as PR comments. No agentic tool-loop,
# no vendor lock-in.
#
# CONFIGURE which model(s) review, via repo Variables:
#   REVIEWERS       Comma-separated list of reviewer "slots" (typically 1-3). Each slot is either:
#                     gemini                -> Google Gemini API direct (model = GEMINI_MODEL)
#                     gemini:<model>        -> Google Gemini API direct, specific model
#                     <openrouter-model-id> -> via OpenRouter, e.g. z-ai/glm-5.2 or
#                                              google/gemini-2.5-flash
#                   Default: "gemini, z-ai/glm-5.2, minimax/minimax-m3" (Flash + GLM + MiniMax).
#                   Multiple slots = independent, diverse second opinions. A repo overrides this
#                   (e.g. REVIEWERS = gemini for a Gemini-only repo with no OpenRouter key).
#                   Examples:
#                     REVIEWERS = gemini
#                     REVIEWERS = gemini, z-ai/glm-5.2
#                     REVIEWERS = google/gemini-2.5-flash, z-ai/glm-5.2
#   GEMINI_MODEL    Model for a bare "gemini" slot (default: gemini-flash-latest).
#   GEMINI_THINKING Reasoning budget for Gemini slots, in tokens; -1 lets the model decide.
#                   UNSET BY DEFAULT, which does NOT mean "no thinking": current Gemini models think
#                   on their own, and you are already billed for it. Measured on gemini-flash-latest
#                   with no thinkingConfig at all: ~1,167 thinking tokens per review call, against
#                   ~524 tokens of actual review. This variable sets the BUDGET for thinking that is
#                   happening either way. Set it only if you have measured that a larger budget earns
#                   its cost on your diffs - a published score for a "(high)" configuration of a
#                   model is not evidence about the default one.
#                   "off"/"none"/"any", or unset, send NO thinkingConfig at all. "0" is different:
#                   it sends an explicit thinkingBudget of 0, which asks the model to disable
#                   thinking. Same intent, different request - use the words unless you specifically
#                   want the explicit form. Anything else non-integer warns and falls back to unset.
#                   Thinking tokens are billed at the OUTPUT rate and are included in the cost
#                   reported in each review's footer.
#
# OpenRouter routing controls (apply to every OpenRouter slot) - repo Variables:
#   OPENROUTER_HOSTS     Strict allow-list of host slugs. Default: EMPTY (no allow-list). Privacy is
#                        enforced by data_collection:deny + OPENROUTER_ZDR, which are request
#                        properties rather than a list that goes stale. Set this only when data
#                        RESIDENCY must be bounded to named providers - the one thing a deny-list
#                        cannot express. A stale allow-list silently excludes better hosts and can
#                        name hosts that no longer serve the model at all.
#   OPENROUTER_IGNORE    Deny-list of host slugs to avoid, e.g. "deepinfra,venice". Prefer this over
#                        an allow-list: it stays correct as providers are added, and entries are only
#                        added in response to measured bad throughput/uptime.
#   OPENROUTER_MAXTOKENS Output ceiling per review - a runaway backstop, not a routine limit. Default
#                        32000; "none" to disable. It is a TOTAL token budget: reasoning models spend
#                        it before emitting any review, so a tight value yields an EMPTY review that
#                        you still pay for. Keep it above the ~19k a real review can reach.
#   OPENROUTER_SORT      throughput (default) | price | latency
#   OPENROUTER_MAXPRICE  hard $/1M ceiling "in,out" (a single value = both). Default "3,10" (fastest host
#                        under it). Premium models (anthropic/*, openai/*) exceed it - set "none" for those.
#   OPENROUTER_ZDR       zero-data-retention hosts only. Default: true. Set "false" to allow
#                        non-ZDR hosts (needed for models that have no ZDR host on OpenRouter).
#   DIFF_EXCLUDE         Comma-separated globs of paths to keep OUT of the review, e.g.
#                        "package-lock.json,*.lock,benchmark/results/*". EMPTY BY DEFAULT.
#                        The diff is capped at 200,000 characters and truncated in GitHub's
#                        ALPHABETICAL file order, so one big generated file pushes real code past
#                        the end - reviewed confidently on a partial payload, at full token cost.
#                        Excluding by path fixes that; raising the cap only moves it. Applies to the
#                        full-file context too. The prompt names what was withheld, so the model
#                        cannot mistake an excluded file for an unchanged one, and the posted review
#                        says how many were held back. These are shell `case`
#                        globs, so `*` matches `/` as well: "dir/*" covers everything beneath it,
#                        and `[` opens a character class - a literal one needs "[[]".
#
#   OPENROUTER_DATA_COLLECTION  deny (default) | allow. "allow" permits providers that train on your
#                        prompts (free "stealth"/preview models). Only for non-proprietary code.
#
# KEYS (repo Secrets; the caller passes exactly these two explicitly - not `secrets: inherit`):
#   GEMINI_API_KEY       for direct Gemini slots      (https://aistudio.google.com/)
#   OPENROUTER_API_KEY   for OpenRouter slots         (https://openrouter.ai/)
#
# By default OpenRouter requests set data_collection:"deny" AND zero data retention, so hosts neither
# train on nor retain your code. Set OPENROUTER_ZDR=false to relax retention, or
# OPENROUTER_DATA_COLLECTION=allow to permit training (only on non-proprietary code).
name: 'Scrutineer (reusable)'

on:
  workflow_call:
    secrets:
      GEMINI_API_KEY:
        required: false
      OPENROUTER_API_KEY:
        required: false

# Serialise runs for one PR (so the de-dupe check below can't race) but NEVER cancel one:
# a cancelled run reads as "it didn't run" in the checks UI. Redundant triggers instead run,
# find the commit already reviewed, and exit 0 (green). Every trigger ends as a success.
concurrency:
  group: 'scrutineer-${{ github.event.pull_request.number || github.event.issue.number }}'
  cancel-in-progress: false

jobs:
  review:
    runs-on: 'ubuntu-latest'
    # Reviewers run in parallel, so wall-clock is the slowest single model call (per-call
    # ceilings are 600s OpenRouter / 240s Gemini) plus checkout - ~11 min worst case. The job
    # ceiling must stay comfortably above the per-call one or it, not curl, becomes the limit.
    timeout-minutes: 15
    # NO permissions block here - deliberately. A called workflow's permissions may not EXCEED the
    # calling job's, and a caller that grants less than we request fails at startup (no steps run,
    # just "startup_failure"). Declaring a set here would therefore break every existing caller the
    # moment we add a scope to it - which is exactly what `checks: read` did once @v1 moved.
    # Omitting the block makes the job inherit the caller's grants, so the caller is the single
    # least-privilege control point (see examples/scrutineer.yml) and new scopes are opt-in:
    # a caller that adds `checks: read` gets CI-aware severity; one that doesn't degrades to
    # CI_STATE=none. Never re-add a permissions block here.
    steps:
      - name: 'Checkout (for optional .review/styleguide.md)'
        uses: 'actions/checkout@v4'
        with:
          persist-credentials: 'false'

      - name: 'Review'
        shell: 'bash'
        env:
          GH_TOKEN: '${{ github.token }}'
          GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}'
          OPENROUTER_API_KEY: '${{ secrets.OPENROUTER_API_KEY }}'
          REVIEWERS: '${{ vars.REVIEWERS }}'
          GEMINI_MODEL: '${{ vars.GEMINI_MODEL }}'
          GEMINI_THINKING: '${{ vars.GEMINI_THINKING }}'
          OPENROUTER_HOSTS: '${{ vars.OPENROUTER_HOSTS }}'
          OPENROUTER_SORT: '${{ vars.OPENROUTER_SORT }}'
          OPENROUTER_MAXPRICE: '${{ vars.OPENROUTER_MAXPRICE }}'
          OPENROUTER_IGNORE: '${{ vars.OPENROUTER_IGNORE }}'
          OPENROUTER_MAXTOKENS: '${{ vars.OPENROUTER_MAXTOKENS }}'
          OPENROUTER_ZDR: '${{ vars.OPENROUTER_ZDR }}'
          OPENROUTER_DATA_COLLECTION: '${{ vars.OPENROUTER_DATA_COLLECTION }}'
          DIFF_EXCLUDE: '${{ vars.DIFF_EXCLUDE }}'
          CONTEXT_BUDGET: '${{ vars.CONTEXT_BUDGET }}'
          REPO: '${{ github.repository }}'
          PR_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number }}'
          COMMENT_BODY: '${{ github.event.comment.body }}'
          HEAD_SHA: '${{ github.event.pull_request.head.sha }}'
        run: |
          set -euo pipefail

          # Preflight: strip whitespace/newlines from the keys. A trailing newline pasted into a
          # Secret is a common cause of OpenRouter's "Missing Authentication header" (and a broken
          # Gemini auth) - normalise it here so a stray character can't produce a failed review.
          GEMINI_API_KEY="$(printf '%s' "${GEMINI_API_KEY:-}" | tr -d '[:space:]')"
          OPENROUTER_API_KEY="$(printf '%s' "${OPENROUTER_API_KEY:-}" | tr -d '[:space:]')"

          if [ -z "${PR_NUMBER:-}" ]; then echo "No PR number; nothing to review."; exit 0; fi

          # Resolve the PR head commit (pull_request provides it; issue_comment must fetch it).
          if [ -z "${HEAD_SHA:-}" ]; then
            HEAD_SHA="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.head.sha' 2>/dev/null || true)"
          fi
          SHORT_SHA="${HEAD_SHA:0:7}"

          # Fetch the comment thread once; reused for de-dupe and for re-review history.
          COMMENTS_JSON="$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate 2>/dev/null | jq -s 'add // []' 2>/dev/null || echo '[]')"

          # Repo file list at the PR head, so a reviewer can tell what exists and never claim a file,
          # asset or import is "missing" when it's simply outside the diff (a recurring false positive).
          # Bounded (paths only, largest repos truncated) - it's a guard rail, not full context.
          REPO_FILES=""
          if [ -n "${HEAD_SHA:-}" ]; then
            REPO_FILES="$(gh api "repos/${REPO}/git/trees/${HEAD_SHA}?recursive=1" --jq '.tree[] | select(.type=="blob") | .path' 2>/dev/null | head -3000 || true)"
            # Truncate on a newline boundary so we never present a half path (e.g. "src/compone").
            if [ "${#REPO_FILES}" -gt 60000 ]; then
              REPO_FILES="${REPO_FILES:0:60000}"; REPO_FILES="${REPO_FILES%$'\n'*}"$'\n...(file list truncated)'
            fi
          fi

          # CI conclusion on the head commit, so the reviewer can calibrate severity (don't cry
          # 🔴/🟠 for something a passing suite already exercises). passing | failing | pending | none.
          # Modern GitHub check-runs only (Actions + Apps); repos on legacy commit *statuses* alone
          # (some Jenkins/CircleCI webhooks) report "none", which the prompt treats as "no signal".
          CI_STATE="none"
          if [ -n "${HEAD_SHA:-}" ]; then
            CI_STATE="$(gh api "repos/${REPO}/commits/${HEAD_SHA}/check-runs" --paginate 2>/dev/null | jq -sr '
              [.[] | (.check_runs // [])[]] as $r
              | if ($r|length) == 0 then "none"
                elif ($r|map(select(.conclusion=="failure" or .conclusion=="timed_out" or .conclusion=="cancelled"))|length) > 0 then "failing"
                elif ($r|map(select(.status!="completed"))|length) > 0 then "pending"
                else "passing" end' 2>/dev/null || echo none)"
            case "$CI_STATE" in passing|failing|pending|none) : ;; *) CI_STATE="none" ;; esac
          fi

          # 1) Diff (truncate on a line boundary so we never send a half hunk).
          # Fetch via the API, NOT `gh pr diff`: on issue_comment (@review) events the workspace only
          # has the base branch checked out, so `gh pr diff` diffs against local git that lacks the PR
          # commits and returns EMPTY -> the review silently no-ops. `gh api ... Accept: diff` always
          # uses the API, so @review works the same as a push. Retry, then fail loudly (never a silent
          # "empty -> exit 0") so a real fetch failure shows red instead of doing nothing.
          DIFF=""; drc=1
          for da in 1 2 3; do
            if DIFF="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" -H "Accept: application/vnd.github.v3.diff" 2>/dev/null)"; then
              drc=0; break
            else
              drc=$?; echo "diff fetch attempt $da failed (rc=$drc)"; [ "$da" -lt 3 ] && sleep $((da*5))
            fi
          done
          if [ "$drc" -ne 0 ]; then
            echo "::error::Could not fetch the PR diff after 3 attempts (GitHub API degraded?). Failing rather than silently posting nothing."
            exit 1
          fi
          if [ -z "$DIFF" ]; then echo "Empty diff; nothing to review."; exit 0; fi
          # 1a) Path exclusions, applied BEFORE the size cap below - which is the entire point.
          # The cap truncates the diff by raw CHARACTER COUNT in GitHub's ALPHABETICAL file order, so
          # one large generated file silently pushes real code past the end. The reviewer then says so
          # in one line of small print and reviews confidently on what it did get, while you pay for
          # every token it read. Measured on this repo's own PR #24: a 353,605-char diff against a
          # 200,000 cap, where 111 committed benchmark artifacts sat alphabetically between
          # manifest.json and run.sh - so run.sh, both test suites and scorecard.json were never in
          # the payload, for ~$0.36 of reviewer spend. Excluding by path removes the cause; raising
          # the cap only moves it, and costs more.
          #
          # DIFF_EXCLUDE is comma-separated shell globs matched against the path. These are `case`
          # patterns, NOT gitignore: `*` matches `/` too, so "benchmark/results/*" covers everything
          # beneath it and "*.lock" matches at any depth. Empty by default - no repo changes
          # behaviour until it opts in. The excluded paths are named in the prompt below, so the
          # model is told they changed and was not shown them, rather than inferring from silence -
          # which is the same trap this feature exists to close, aimed at the model instead of the
          # reader.
          EXPATS=()
          [ -n "${DIFF_EXCLUDE:-}" ] && IFS=',' read -r -a EXPATS <<< "$DIFF_EXCLUDE"
          path_excluded() {
            local pth="$1" pat
            for pat in ${EXPATS[@]+"${EXPATS[@]}"}; do
              pat="${pat#"${pat%%[![:space:]]*}"}"; pat="${pat%"${pat##*[![:space:]]}"}"
              [ -n "$pat" ] || continue
              # shellcheck disable=SC2254  # unquoted deliberately: $pat IS the glob to match against
              case "$pth" in $pat) return 0 ;; esac
            done
            return 1
          }
          EXCLUDED_PATHS=""
          if [ "${#EXPATS[@]}" -gt 0 ]; then
            while IFS= read -r pth; do
              [ -n "$pth" ] || continue
              path_excluded "$pth" && EXCLUDED_PATHS="${EXCLUDED_PATHS}${pth}"$'\n'
            done < <(printf '%s\n' "$DIFF" | sed -n 's|^diff --git a/.* b/||p')
          fi
          EXCL_NOTE=""
          if [ -n "$EXCLUDED_PATHS" ]; then
            n_excl="$(printf '%s' "$EXCLUDED_PATHS" | grep -c . || true)"
            before=${#DIFF}
            # Drop whole `diff --git` sections whose path matched. Bash did the globbing (correct
            # shell semantics); awk only does the set lookup.
            # Passed via ENVIRON, not -v: awk processes backslash escapes in a -v assignment, so a
            # path containing a literal backslash followed by n/t/... would be mis-keyed and survive
            # the filter unnoticed. ENVIRON is taken verbatim.
            DIFF="$(printf '%s\n' "$DIFF" | EXCL="$EXCLUDED_PATHS" awk '
              BEGIN { n = split(ENVIRON["EXCL"], a, "\n"); for (i = 1; i <= n; i++) if (a[i] != "") drop[a[i]] = 1 }
              # Assumes no path contains " b/": the .* is greedy, so "a/x b/y.txt b/x b/y.txt"
              # extracts "y.txt". Harmless because the sed above derives its key the same way, so
              # both sides agree and the file simply is not excluded - never the wrong file. Left as
              # is rather than rewritten: a correct parser for that case is more fragile than the
              # case is likely, and this code is under test.
              /^diff --git / { p = $0; sub(/^diff --git a\/.* b\//, "", p); skip = (p in drop) }
              !skip')"
            echo "DIFF_EXCLUDE dropped ${n_excl} file(s) from the diff: ${before} -> ${#DIFF} chars."
            EXCL_NOTE="$(printf '\n\n> Note: %s changed file(s) were excluded from the diff by DIFF_EXCLUDE and were not reviewed.' "$n_excl")"
          fi

          # The "Empty diff" guard above runs BEFORE exclusions, so it cannot catch this: a pattern
          # broad enough to match every changed file (say "*", or "*.ts" on a TypeScript-only PR)
          # leaves nothing behind and the run would otherwise continue into a paid model call with an
          # empty diff and empty context, posting a baffled "I see no changes" review. Exit green -
          # nothing to review is a success, exactly as it is for a genuinely empty diff.
          if [ -n "$EXCLUDED_PATHS" ] && [ -z "${DIFF//[[:space:]]/}" ]; then
            echo "All ${n_excl} changed file(s) matched DIFF_EXCLUDE; nothing left to review."
            exit 0
          fi

          MAX=200000
          TRUNC_NOTE=""
          if [ "${#DIFF}" -gt "$MAX" ]; then
            DIFF="${DIFF:0:$MAX}"; DIFF="${DIFF%$'\n'*}"
            TRUNC_NOTE="$(printf '\n\n> Note: diff truncated at a line boundary; only the first part was reviewed.')"
          fi

          # 1b) Full current content of the changed files (largest change first) so the model can
          #     reason beyond the diff hunks - callers, helpers, error/fallback paths, and how a value
          #     set in one place is used elsewhere. Budget-bounded; text files only.
          # Both Gemini and GLM have ~1M-token context, so this budget is a cost/latency guard, not a
          # context limit - the default comfortably fits every changed file in a normal PR. Set the
          # CONTEXT_BUDGET repo Variable to raise or lower it.
          CONTEXT_BUDGET="${CONTEXT_BUDGET:-600000}"
          [[ "$CONTEXT_BUDGET" =~ ^[0-9]+$ ]] || CONTEXT_BUDGET=600000   # ignore a non-numeric override
          FILES_CTX=""; used=0
          CHANGED_JSON="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" --paginate 2>/dev/null | jq -s 'add // []' 2>/dev/null || echo '[]')"
          mapfile -t CHANGED < <(printf '%s' "$CHANGED_JSON" | jq -r 'sort_by(-.changes)[] | select(.status != "removed") | .filename' 2>/dev/null || true)
          for f in "${CHANGED[@]:-}"; do
            [ -z "$f" ] && continue
            # Lockfiles: the FULL CONTENT of one is never useful to a reviewer and routinely runs to
            # hundreds of KB. "*.lock" caught yarn/Cargo/poetry/composer but MISSED npm's, which is
            # named package-lock.json and so ends in .json - the single most common lockfile in the
            # estate. The effect was that any npm dependency PR handed the model an entire lockfile,
            # exhausting CONTEXT_BUDGET so real changed files were dropped from context, and driving
            # the input large enough to time reviewers out or burn their whole output budget on
            # reasoning. Observed on SimplerHR-Stour#44 (GLM timed out at 600s) and
            # Sell-Faster-on-eBay#47. The *-lock.json / *-lock.yaml patterns generalise it.
            case "$f" in *.png|*.jpg|*.jpeg|*.gif|*.ico|*.svg|*.pdf|*.zip|*.gz|*.tar|*.woff|*.woff2|*.ttf|*.eot|*.mp3|*.mp4|*.wav|*.lock|*-lock.json|*-lock.yaml|npm-shrinkwrap.json|bun.lockb|*.min.js|*.min.css) continue ;; esac
            # DIFF_EXCLUDE applies here too. Excluding a file from the diff but still sending its
            # full content would leave it consuming CONTEXT_BUDGET - the fix would only half work,
            # and on a lockfile the content is far bigger than its diff.
            path_excluded "$f" && continue
            # URL-encode the path (preserving slashes) so paths with spaces resolve; strip any invalid
            # UTF-8 (a binary file with an unlisted extension) so it can never break the JSON encode.
            f_enc="$(printf '%s' "$f" | jq -sRr @uri | sed 's/%2F/\//g')"
            content="$(gh api "repos/${REPO}/contents/${f_enc}?ref=${HEAD_SHA}" --jq '.content' 2>/dev/null | base64 -d 2>/dev/null | iconv -c -f utf-8 -t utf-8 2>/dev/null || true)"
            [ -z "$content" ] && continue
            block="$(printf '\n\n===== FILE: %s (full current content) =====\n%s\n' "$f" "$content")"
            # Over budget: skip this file but keep trying smaller ones (files are largest-first), and
            # add the "omitted" note only once.
            if [ $(( used + ${#block} )) -gt "$CONTEXT_BUDGET" ]; then
              [ -z "${OMIT_NOTE:-}" ] && { FILES_CTX="${FILES_CTX}$(printf '\n\n> Note: some changed files were omitted from the context to stay within budget.')"; OMIT_NOTE=1; }
              continue
            fi
            FILES_CTX="${FILES_CTX}${block}"; used=$(( used + ${#block} ))
          done

          # 2) Optional per-repo style guide.
          STYLE=""
          [ -f .review/styleguide.md ] && STYLE="$(cat .review/styleguide.md)"

          # 3) Prior conversation (our reviews + human replies) for context-aware re-reviews.
          # `// ""` on every .body read: jq errors on null (the API can return one), and because
          # the failure is swallowed below a single null comment would silently empty HISTORY -
          # losing the reviewer all prior conversation on exactly the re-review that needs it.
          HISTORY="$(printf '%s' "$COMMENTS_JSON" | jq -r '
              def body: .body // "";
              map(select((body | startswith("## 🤖 Review")) or (.user.type == "User")))
              | map(if (body | startswith("## 🤖 Review"))
                    then "### Your previous review:\n" + body
                    else "### Developer response (" + (.user.login // "unknown") + "):\n" + body end)
              | join("\n\n---\n\n")' 2>/dev/null || true)"
          if [ "${#HISTORY}" -gt 20000 ]; then HISTORY="${HISTORY: -20000}"; fi

          # 4) Build the prompt.
          INSTRUCTIONS="$(printf '%s\n' \
            'You are a senior software engineer acting as a second reviewer on a GitHub pull request.' \
            'You are given the unified diff AND the full current content of the changed files. Use the full' \
            'files to reason about code the diff does not show: callers, helpers, error-handling and fallback' \
            'paths, and how a value written in one place is used elsewhere.' \
            'Write a concise, high-signal review in GitHub markdown.' \
            '' \
            'Use these sections (omit a severity bucket if it has no items):' \
            '## 📋 Summary - 2-3 sentences on what the PR does and its overall quality.' \
            '## 🔍 Findings - bullets grouped as 🔴 Critical, 🟠 High, 🟡 Medium, 🟢 Low.' \
            '  For each finding cite the file and approximate line, and give a specific, actionable fix.' \
            '## ✅ Positives - briefly note anything done well.' \
            '' \
            'Focus on correctness, security, performance, error handling and missing tests. Pay particular' \
            'attention to: state that is written but never cleared or invalidated; default values that misbehave' \
            '(for example a -1 index that silently wraps to the last element in Python); callback or signal' \
            'wiring; and exception/fallback paths that return stale or wrong data.' \
            '' \
            'Report only issues you can tie to a specific line and whose concrete failure path you can state.' \
            'Before finalising, re-read each flagged line to confirm it really says what you claim and that the' \
            'surrounding code does not already handle it - do not invent problems. Reserve 🔴 Critical for a' \
            'demonstrable crash, data loss or security hole. If the change is trivial or looks good, say so plainly.' \
            '' \
            'Do NOT claim a file, asset, import, symbol or route is missing without checking the repository file' \
            'list provided below: a path being absent from the diff does not mean it is absent from the repo.' \
            'Calibrate severity against the CI status provided below. If CI is passing, do not raise 🔴 Critical or' \
            '🟠 High for a failure a normal build/test suite would already have caught (a crash, build break, type' \
            'error, or failed migration on a path CI exercises) unless you can say why CI would miss it - an' \
            'untested path, a security or data-loss issue, or a runtime/environment-only condition. When unsure,' \
            'lower the severity or frame it as a question rather than asserting Critical.')"
          REREVIEW="$(printf '%s\n' \
            'If a PRIOR CONVERSATION section appears below, this is a RE-REVIEW. Treat it as a continuing two-way conversation:' \
            '- Begin with a "## 🔄 Since last review" section: ✅ Resolved (now fixed), 🤝 Acknowledged (the developer gave a sound reason not to change something and you agree - do not raise it again), ⚠️ Still open.' \
            '- Do NOT repeat resolved or acknowledged items under Findings; only include new or still-unresolved issues.' \
            '- If you disagree with a developer response, keep it open and briefly explain why. Change your mind when the reasoning is sound.')"
          PROMPT="${INSTRUCTIONS}

          ${REREVIEW}"
          if [ -n "$STYLE" ]; then
            PROMPT="${PROMPT}

          Team style guide to enforce:
          ${STYLE}"
          fi
          if [ -n "$HISTORY" ]; then
            PROMPT="${PROMPT}

          PRIOR CONVERSATION (your earlier reviews and the developer's responses, oldest first):
          ${HISTORY}"
          fi
          PROMPT="${PROMPT}

          Current unified diff to review:
          ${DIFF}"
          if [ -n "$EXCLUDED_PATHS" ]; then
            PROMPT="${PROMPT}

          These changed files were deliberately withheld from the diff and file context above by this
          repo's DIFF_EXCLUDE setting (typically lockfiles or generated output). They DID change in
          this PR. Do not infer anything from their absence, and do not report them as unchanged:
          ${EXCLUDED_PATHS}"
          fi
          if [ -n "$FILES_CTX" ]; then
            PROMPT="${PROMPT}

          Full current content of the changed files (for context beyond the diff):
          ${FILES_CTX}"
          fi
          PROMPT="${PROMPT}

          CI status on this PR's head commit: ${CI_STATE} (calibrate finding severity against this)."
          if [ -n "$REPO_FILES" ]; then
            PROMPT="${PROMPT}

          Files that exist in the repository at this commit (do NOT claim any of these is missing; a
          file not shown in the diff still exists):
          ${REPO_FILES}"
          fi

          # 5) Model callers. Each echoes the review text.
          call_gemini() {
            local model="$1" req resp text err http rc fr why pt ct timeout=240
            if [ -z "${GEMINI_API_KEY:-}" ]; then printf '⚠️ GEMINI_API_KEY is not set for this repo.'; return; fi
            # Build the request and send it via stdin, never argv: PROMPT can be hundreds of KB, which
            # would blow the OS single-argument limit (~128KB) if passed to jq --arg or curl -d.
            # Reasoning effort, OFF unless GEMINI_THINKING is set - deliberately opt-in. Every repo
            # in the estate inherits this workflow; thinking tokens are BILLED, and a field this API
            # version did not recognise would 400 every Gemini review at once. Opt-in keeps both the
            # cost and the blast radius with whoever turns it on.
            #
            # Value is a thinkingBudget in tokens; -1 asks the model to decide (dynamic). Scrutineer
            # sent no reasoning config at all before this, so every Gemini review ran at whatever the
            # model defaults to - which is worth knowing when comparing against a published score for
            # a "(high)" reasoning configuration of the same model.
            # Trim only the ENDS. Stripping all whitespace would turn " 1 2" into "12" - a number
            # the user never wrote, silently passing validation. Surprising a caller with a value
            # they did not set is the exact failure this validation exists to prevent.
            gt="${GEMINI_THINKING:-}"
            gt="${gt#"${gt%%[![:space:]]*}"}"; gt="${gt%"${gt##*[![:space:]]}"}"
            case "$gt" in off|none|any) gt="" ;; esac
            if [ -n "$gt" ]; then
              case "${gt#-}" in
                ''|*[!0-9]*) echo "Ignoring malformed GEMINI_THINKING='${GEMINI_THINKING}' (want an integer thinkingBudget, or -1 for dynamic)."; gt="" ;;
              esac
            fi
            # Regex-guarded rather than an is-it-empty test, so the filter is TOTAL: jq's tonumber
            # aborts on a non-numeric string, which would yield an empty request body. The bash
            # validation above already guarantees numeric-or-empty and is what warns; this is the
            # backstop that keeps a validation bug from turning into an unexplained failure.
            req="$(printf '%s' "$PROMPT" | jq -Rsc --arg gt "$gt" '
              {contents:[{parts:[{text:.}]}]}
              + (if ($gt | test("^-?[0-9]+$"))
                 then {generationConfig:{thinkingConfig:{thinkingBudget:($gt|tonumber)}}}
                 else {} end)')"
            rc=0; resp="$(printf '%s' "$req" | curl -sS -m "$timeout" -w '\n__HTTP__%{http_code}' "https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${GEMINI_API_KEY}" -H 'Content-Type: application/json' --data-binary @-)" || rc=$?
            http=""; case "$resp" in *__HTTP__*) http="${resp##*__HTTP__}"; resp="${resp%__HTTP__*}"; resp="${resp%$'\n'}";; esac
            text="$(printf '%s' "$resp" | jq -r '.candidates[0].content.parts[0].text // empty' 2>/dev/null)"
            # Hoisted out of the empty-content branch below: the truncation check needs it even when
            # content IS present, which is the whole point of the MAX_TOKENS branch at the end.
            fr="$(printf '%s' "$resp" | jq -r '.candidates[0].finishReason // .promptFeedback.blockReason // empty' 2>/dev/null)"
            if [ -z "$text" ]; then
              # Report the actual cause, never a bare "no response".
              err="$(printf '%s' "$resp" | jq -r '.error.message // empty' 2>/dev/null)"
              if   [ "$rc" = 28 ];           then why="Gemini did not respond within ${timeout}s. This is a SPEED limit, not an output limit. The payload was ${#PROMPT} characters - of which the full-file context is usually the larger part, so lower CONTEXT_BUDGET (or set DIFF_EXCLUDE) before assuming the diff is at fault. A smaller PR or gemini-flash-latest also helps."
              elif [ "$rc" != 0 ];           then why="could not reach the Gemini API (curl exit $rc)"
              elif [ -n "$err" ];            then why="Gemini API error${http:+ (HTTP $http)}: $err"
              elif [ "$fr" = "MAX_TOKENS" ]; then why="the model hit its output limit before finishing the review (finishReason=MAX_TOKENS); Gemini has no equivalent of OPENROUTER_MAXTOKENS, so the payload is the only lever - it was ${#PROMPT} characters. Lower CONTEXT_BUDGET, set DIFF_EXCLUDE, or split the PR."
              elif [ -n "$fr" ];             then why="no review returned (finishReason=$fr - e.g. a SAFETY or RECITATION block)"
              elif [ -n "$http" ] && [ "$http" != 200 ]; then why="HTTP $http from the Gemini API"
              else                                why="empty response from the Gemini API (HTTP ${http:-unknown})"
              fi
              text="$(printf '⚠️ Could not generate review.\n\n```\n%s\n```' "$why")"
            elif [ "$fr" = "MAX_TOKENS" ]; then
              # Same defect as the OpenRouter path: finishReason was only consulted when content was
              # empty, so a Gemini review truncated partway through posted as if complete. Gemini has
              # no OPENROUTER_MAXTOKENS equivalent, so the remedy is diff size rather than a limit.
              text="$(printf '%s\n\n---\n\n⚠️ **This review was cut off before it finished** (`finishReason=MAX_TOKENS`). Anything past the cut is missing, including findings it had not reached - do not read the absence of a finding as a pass. Reduce the diff size or `CONTEXT_BUDGET` and re-run.' "$text")"
            fi
            # Telemetry -> temp file the caller reads (functions run in a subshell, so globals won't
            # propagate). Gemini has no USD in its response, so cost is left "na" (estimate from tokens).
            pt="$(printf '%s' "$resp" | jq -r '.usageMetadata.promptTokenCount // 0' 2>/dev/null || echo 0)"
            # Thinking tokens are billed at the output rate but reported separately from
            # candidatesTokenCount, so with GEMINI_THINKING on, counting only candidates would report
            # a spend materially lower than the bill. Summed so the telemetry stays honest.
            ct="$(printf '%s' "$resp" | jq -r '(.usageMetadata.candidatesTokenCount // 0) + (.usageMetadata.thoughtsTokenCount // 0)' 2>/dev/null || echo 0)"
            case "$pt" in ''|*[!0-9]*) pt=0 ;; esac; case "$ct" in ''|*[!0-9]*) ct=0 ;; esac
            # 4th field is the routed host; Gemini is called directly (not via OpenRouter) so it's "na".
            [ -n "${SLOT_META:-}" ] && printf '%s %s na na\n' "${pt:-0}" "${ct:-0}" > "$SLOT_META"
            printf '%s' "$text"
          }
          # Which output ceiling actually bound this call? OPENROUTER_MAXTOKENS and the curl -m
          # timeout are BOTH ceilings on output, and on any given call only one of them is real.
          # Telling someone to "raise OPENROUTER_MAXTOKENS" when the TIMEOUT is the binding
          # constraint is worse than unhelpful: the larger cap lets the model run past the old
          # limit and into the timeout, and a timeout posts NOTHING where the cap at least posts a
          # partial review with a banner. The advice would cost you the review it claims to save.
          #
          # Measured on ba-verify-line#320: minimax hit the cap while ox-alpha timed out, same
          # commit, same 205k-token payload - the two outcomes differ only by host throughput. A
          # static string cannot tell those apart, so the remedy is derived rather than asserted:
          # extrapolate what this host could emit inside the window from what it just did.
          #
          # Reads $el, $timeout, $MT and $resp from the calling function - bash is dynamically
          # scoped, and this is only ever called from call_openrouter after the request returns.
          cap_advice() {
            local pt_in tps win
            pt_in="$(printf '%s' "$resp" | jq -r '.usage.prompt_tokens // 0' 2>/dev/null || echo 0)"
            case "$pt_in" in ''|*[!0-9]*) pt_in=0 ;; esac
            local sz=""
            [ "$pt_in" -gt 0 ] && sz=" This prompt was ${pt_in} tokens (the payload ceiling is the 200,000-char diff cap plus CONTEXT_BUDGET)."
            # No cap set, so the model stopped on its own limit; only the payload is ours to change.
            if [ -z "${MT:-}" ]; then
              printf 'No OPENROUTER_MAXTOKENS is set, so this is the model own output limit - reduce the payload (DIFF_EXCLUDE, a lower CONTEXT_BUDGET, or a smaller PR).%s' "$sz"
              return
            fi
            tps=$(( MT / el ))
            win=$(( tps * timeout ))
            # Under 20%% headroom means the window, not the cap, is what stopped it.
            if [ "$win" -lt $(( MT * 12 / 10 )) ]; then
              printf 'Raising OPENROUTER_MAXTOKENS will NOT help and will likely make this worse: at the observed ~%s tok/s this host can only emit ~%s tokens inside the %ss call timeout, so a higher cap ends in a timeout - which posts no review at all - rather than a longer review. Reduce the payload instead (DIFF_EXCLUDE, a lower CONTEXT_BUDGET, or a smaller PR), or allow a faster host with a higher OPENROUTER_MAXPRICE.%s' "$tps" "$win" "$timeout" "$sz"
            else
              printf 'Raising OPENROUTER_MAXTOKENS should help here: at the observed ~%s tok/s this host could emit ~%s tokens within the %ss timeout, well above the current %s.%s' "$tps" "$win" "$timeout" "$MT" "$sz"
            fi
          }

          call_openrouter() {
            local model="$1" req resp text err base prov sort http rc fr why pt ct cost host timeout=600 HOSTS IGN MP mp_re MT MT_DEFAULT DC
            if [ -z "${OPENROUTER_API_KEY:-}" ]; then printf '⚠️ OPENROUTER_API_KEY is not set for this repo.'; return; fi
            sort="${OPENROUTER_SORT:-throughput}"
            # Data collection is DENIED by default (no provider may train on your code). A repo may set
            # OPENROUTER_DATA_COLLECTION=allow to permit data-collecting providers - e.g. free "stealth"/
            # preview models that pay for themselves by training on prompts. Only sensible on
            # non-proprietary code; anything but "allow" falls back to "deny" (fail safe).
            DC="${OPENROUTER_DATA_COLLECTION:-deny}"; [ "$DC" = allow ] || DC=deny
            base="$(jq -n --arg s "$sort" --arg dc "$DC" '{data_collection:$dc, sort:$s, allow_fallbacks:true}')"
            # No allow-list by DEFAULT. A hand-maintained "only" list silently rots: it cannot know
            # when a provider stops serving a model (our old default named a host that does not serve
            # minimax-m3 at all) and it excludes every provider added after it was written, including
            # better ones. Privacy is enforced by data_collection:deny + zdr below, which are properties
            # of the request rather than a list someone has to remember to update.
            # Set OPENROUTER_HOSTS to re-impose a strict allow-list where data RESIDENCY must be bounded
            # to named providers - that is the one guarantee a deny-list cannot give you.
            HOSTS="${OPENROUTER_HOSTS:-}"
            case "$HOSTS" in any|all|'*') HOSTS="" ;; esac
            [ -n "$HOSTS" ] && base="$(printf '%s' "$base" | jq --arg l "$HOSTS" '. + {only:($l|split(",")|map(gsub("^ +| +$";"")))}')"
            # Deny-list for hosts we have measured as bad for our workload (low throughput or poor
            # uptime). Unlike an allow-list this stays correct as the ecosystem grows: new providers
            # are usable immediately, and we only ever add an entry in response to evidence.
            IGN="${OPENROUTER_IGNORE:-}"
            [ -n "$IGN" ] && base="$(printf '%s' "$base" | jq --arg l "$IGN" '. + {ignore:($l|split(",")|map(gsub("^ +| +$";"")))}')"
            # Zero data retention is ON by default; set OPENROUTER_ZDR=false to allow non-ZDR hosts.
            [ "${OPENROUTER_ZDR:-true}" != "false" ] && base="$(printf '%s' "$base" | jq '. + {zdr:true}')"
            # $/1M ceiling "in,out": with throughput sort this stops routing to a premium (fast but dear)
            # host. Default "3,10". NOT arbitrary: at the old "2,6" we measured GLM's fast host at
            # ~$2.30/1M input being excluded by 30c, which pushed reviews onto hosts slow enough to blow
            # the timeout - the ceiling was costing us the reviewer to save pennies. Set "none" to disable.
            MP="${OPENROUTER_MAXPRICE:-3,10}"
            MP="${MP//[[:space:]]/}"                    # tolerate "2, 6" / " 2.5 "
            case "$MP" in none|off|any) MP="" ;; esac   # explicit opt-out -> no ceiling
            # A malformed value (letters, ".", "2.", stray commas) falls back to the safe default rather
            # than failing OPEN (no ceiling) - a typo must not silently remove the cost guard.
            mp_re='^[0-9]+(\.[0-9]+)?(,[0-9]+(\.[0-9]+)?)?$'
            if [ -n "$MP" ] && ! [[ "$MP" =~ $mp_re ]]; then
              echo "Malformed OPENROUTER_MAXPRICE='${OPENROUTER_MAXPRICE}'; using default 3,10."; MP="3,10"
            fi
            # A single value applies to both in and out (.[1]//.[0]).
            [ -n "$MP" ] && base="$(printf '%s' "$base" | jq --arg m "$MP" '. + ($m|split(",")|{max_price:{prompt:(.[0]|tonumber), completion:((.[1]//.[0])|tonumber)}})')"
            prov="$base"
            # Output ceiling - a RUNAWAY BACKSTOP, deliberately well above normal. Latency is roughly
            # output_tokens / host_throughput, so an unbounded reviewer can blow the timeout. But the
            # cap must sit ABOVE the observed range or it breaks working reviews: measured legitimate
            # reviews reach ~19k output tokens, so 10000 (the first value shipped) was below normal and
            # not a backstop at all.
            # It is also a TOTAL token budget, not a content budget. A reasoning model spends it on
            # reasoning FIRST, so a tight cap can be exhausted before a single word of review is
            # emitted - which returns finish_reason=length with EMPTY content, i.e. billed and useless.
            # That is exactly what 10000 did to minimax-m3 on a large PR. Hence 32000: above the
            # observed maximum with room for a reasoning pass. Set OPENROUTER_MAXTOKENS=none to remove.
            MT_DEFAULT=32000                            # one place: the fallback below reuses it
            MT="${OPENROUTER_MAXTOKENS:-$MT_DEFAULT}"
            MT="${MT//[[:space:]]/}"
            case "$MT" in none|off|any) MT="" ;; esac
            # Digits only AND >= 1. max_tokens:0 is accepted by the API but returns an empty
            # completion, which would surface as the generic "no review content returned" error
            # instead of naming the misconfiguration - so treat it as malformed and fall back to
            # the default rather than failing open. ($MT is non-empty here, so the '' branch the
            # digit test would otherwise need is unreachable and omitted.)
            if [ -n "$MT" ]; then
              case "$MT" in *[!0-9]*) MT="" ;; esac
              if [ -z "$MT" ] || [ "$MT" -lt 1 ]; then
                echo "Invalid OPENROUTER_MAXTOKENS='${OPENROUTER_MAXTOKENS}'; using ${MT_DEFAULT}."; MT=$MT_DEFAULT
              fi
              # Force base 10 and strip leading zeros: "0500" is not a valid JSON number, so
              # passing it through to --argjson would rely on jq being lenient about it.
              MT=$((10#$MT))
            fi
            # Build the request and send it via stdin, never argv (see call_gemini): the prompt is far
            # larger than the OS single-argument limit once file context is included.
            req="$(printf '%s' "$PROMPT" | jq -Rsc --arg m "$model" --argjson prov "$prov" \
                     --argjson mt "${MT:-null}" \
                     '{model:$m, messages:[{role:"user",content:.}], provider:$prov, usage:{include:true}}
                      + (if $mt == null then {} else {max_tokens:$mt} end)')"
            el0=$SECONDS
            rc=0; resp="$(printf '%s' "$req" | curl -sS -m "$timeout" -w '\n__HTTP__%{http_code}' "https://openrouter.ai/api/v1/chat/completions" -H "Authorization: Bearer ${OPENROUTER_API_KEY}" -H 'Content-Type: application/json' -H 'HTTP-Referer: https://github.com' -H 'X-Title: Scrutineer' --data-binary @-)" || rc=$?
            el=$(( SECONDS - el0 )); [ "$el" -lt 1 ] && el=1
            http=""; case "$resp" in *__HTTP__*) http="${resp##*__HTTP__}"; resp="${resp%__HTTP__*}"; resp="${resp%$'\n'}";; esac
            text="$(printf '%s' "$resp" | jq -r '.choices[0].message.content // empty' 2>/dev/null)"
            fr="$(printf '%s' "$resp" | jq -r '.choices[0].finish_reason // empty' 2>/dev/null)"
            # Some reasoning models (minimax-m3) emit their chain-of-thought INSIDE message.content
            # rather than in a separate reasoning field, so the posted review opens with pages of
            # "Let me analyze this carefully..." before reaching a single finding. That is the
            # model's private working, not review output, and it also consumes the output budget -
            # which is how a review ends up truncated mid-sentence.
            #
            # Only strip when the content STARTS with the tag, which is the actual failure mode. A
            # review that merely quotes a think tag mid-body (one reviewing THIS code, say) is left
            # untouched - stripping "everything up to the last closing tag" unconditionally would
            # eat the real review above it.
            if [[ "$text" =~ ^[[:space:]]*\<[A-Za-z0-9_]*:?think\> ]]; then
              if printf '%s' "$text" | grep -q '</[A-Za-z0-9_:]*think>'; then
                text="$(printf '%s' "$text" | jq -Rsr 'gsub("(?s)^.*</[A-Za-z0-9_:]*think>\\s*"; "")' 2>/dev/null)"
              else
                # Opening tag with no closing tag: cut off mid-thought, so there is no review
                # underneath to salvage. Emptying it falls through to the reporting below, which
                # names finish_reason=length rather than posting a wall of reasoning.
                text=""
              fi
            fi
            if [ -z "$text" ]; then
              # Report the actual cause, never a bare "no response".
              err="$(printf '%s' "$resp" | jq -r '.error.message // empty' 2>/dev/null)"
              if   [ "$rc" = 28 ];         then why="the model did not respond within ${timeout}s. This is a SPEED limit, not an output limit - raising OPENROUTER_MAXTOKENS cannot fix it and makes it likelier. The payload was ${#PROMPT} characters; reduce it (DIFF_EXCLUDE, a lower CONTEXT_BUDGET, or a smaller PR) or allow a faster host with a higher OPENROUTER_MAXPRICE."
              elif [ "$rc" != 0 ];         then why="could not reach OpenRouter (curl exit $rc)"
              elif [ -n "$err" ];          then why="OpenRouter error${http:+ (HTTP $http)}: $err"
              elif [ "$fr" = "length" ];   then why="the model hit its output limit before finishing the review (finish_reason=length, limit ${MT:-none}). $(cap_advice)"
              elif [ -n "$fr" ];           then why="no review content returned (finish_reason=$fr, HTTP ${http:-unknown})"
              elif [ -n "$http" ] && [ "$http" != 200 ]; then why="HTTP $http from OpenRouter"
              else                              why="empty response from OpenRouter (HTTP ${http:-unknown}) - likely no host matched the current routing constraints (OPENROUTER_HOSTS / OPENROUTER_ZDR / OPENROUTER_MAXPRICE)"
              fi
              text="$(printf '⚠️ Could not generate review.\n\n```\n%s\n```' "$why")"
            elif [ "$fr" = "length" ]; then
              # Truncated but NOT empty. Until this branch existed finish_reason was only consulted
              # when content was empty, so a review cut off partway through was posted looking
              # complete - and one cut off before its Findings section silently loses findings you
              # were billed for. Keep the partial review (it still has value) and say it stopped.
              text="$(printf '%s\n\n---\n\n⚠️ **This review was cut off before it finished** (`finish_reason=length`, limit %s). Anything past the cut is missing, including findings it had not reached - do not read the absence of a finding as a pass.\n\n%s' "$text" "${MT:-none}" "$(cap_advice)")"
            fi
            # Telemetry: tokens + OpenRouter's real USD cost (usage.include:true above).
            pt="$(printf '%s' "$resp" | jq -r '.usage.prompt_tokens // 0' 2>/dev/null || echo 0)"
            ct="$(printf '%s' "$resp" | jq -r '.usage.completion_tokens // 0' 2>/dev/null || echo 0)"
            case "$pt" in ''|*[!0-9]*) pt=0 ;; esac; case "$ct" in ''|*[!0-9]*) ct=0 ;; esac
            cost="$(printf '%s' "$resp" | jq -r '.usage.cost // "na"' 2>/dev/null || echo na)"
            # Keep only a decimal number or the literal "na"; anything else (a malformed or hostile
            # provider value) must not reach the HTML comment marker in the posted review.
            [ "$cost" = na ] || case "$cost" in ''|*[!0-9.]*) cost=na ;; esac
            # Which host OpenRouter actually routed to (per-model: the same allow-list resolves to
            # different providers for GLM vs MiniMax etc.). Recorded so a slow/timing-out model can be
            # traced to a specific host and that host excluded via OPENROUTER_HOSTS. Sanitised to a
            # single bare token so it can't break the space-delimited SLOT_META line or the marker.
            host="$(printf '%s' "$resp" | jq -r '.provider // "na"' 2>/dev/null || echo na)"
            host="$(printf '%s' "$host" | tr -cd 'A-Za-z0-9._-')"; [ -z "$host" ] && host=na
            [ -n "${SLOT_META:-}" ] && printf '%s %s %s %s\n' "${pt:-0}" "${ct:-0}" "${cost:-na}" "$host" > "$SLOT_META"
            printf '%s' "$text"
          }
          post_review() {
            local body
            # The trailing HTML comment is invisible in the rendered review but lets a later run
            # detect that this slot already reviewed this exact commit (see already_reviewed).
            # Marker also carries per-review telemetry (latency, tokens, real cost) so a trial can be
            # aggregated straight from the PR comments - Gemini included (it is not in OpenRouter billing).
            body="$(printf '## 🤖 Review - `%s`\n\n%s%s\n\n<sub>Automated review - not a substitute for human review.</sub>\n<!-- scrutineer sha=%s lat=%ss in=%s out=%s cost=%s host=%s -->' "$1" "$2" "${EXCL_NOTE}${TRUNC_NOTE}" "${HEAD_SHA:-none}" "${3:-0}" "${4:-0}" "${5:-0}" "${6:-na}" "${7:-na}")"
            printf '%s' "$body" | gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file -
          }

          # De-dupe: has this slot already posted a SUCCESSFUL review for the current commit, with no
          # new developer activity since? If so, skip it. A bare repeat "@review" on an unchanged commit
          # is a no-op; a new commit (SHA changes) or a substantive reply (not just "@review") re-triggers.
          already_reviewed() {
            local label="$1"
            [ -z "${HEAD_SHA:-}" ] && return 1
            # Attribution is ANCHORED, never a substring search over the whole body: a comment
            # counts as this slot's review only if the header is its FIRST line and its own
            # marker is its LAST. Models are shown the prior review thread and do sometimes
            # quote another reviewer's comment back verbatim - marker included - so a
            # contains() match would credit that reviewer with a review it never ran and
            # silently skip it on this commit. Anchoring makes a quoted header or marker inert.
            # (The "could not generate" test stays a contains(): a quoted failure notice at
            # worst re-runs a review, which is the safe direction to fail.)
            # Every .body is read through `// ""`: the API can hand back a null body (and jq
            # errors on null for both split and contains). A single null anywhere in the thread
            # would abort the whole filter, and since jq's failure is swallowed below the slot
            # would re-review on every run.
            printf '%s' "$COMMENTS_JSON" | jq -e \
              --arg head "## 🤖 Review - \`$label\`" --arg sha "$HEAD_SHA" '
              def body: .body // "";
              def own_review($h; $s):
                (body | split("\n") | map(rtrimstr("\r"))) as $lines
                | (($lines | first) // "") == $h
                and ((($lines | map(select(. != "")) | last) // "")
                     | startswith("<!-- scrutineer sha=" + $s));
              (map(select(.user.type=="Bot"
                          and own_review($head; $sha)
                          and ((body|contains("⚠️ Could not generate review"))|not))) | last) as $a
              | if $a==null then false
                else ([ .[] | select(.user.type=="User"
                          and (.created_at > $a.created_at)
                          and ((body|ascii_downcase|gsub("^\\s+";"")|startswith("@review"))|not)) ] | length) == 0
                end' >/dev/null 2>&1
          }

          # A single reviewer slot: direct Gemini, or an OpenRouter model id.
          run_slot() {
            local spec="$1" model label text
            case "$spec" in
              gemini)   model="${GEMINI_MODEL:-gemini-flash-latest}"; label="$model" ;;
              gemini:*) model="${spec#gemini:}"; label="$model" ;;
              *)        model="$spec"; label="$spec (via OpenRouter)" ;;
            esac
            # Skip a slot whose key is not configured - silently (log only, no PR comment). This lets
            # the GLM+Flash default degrade cleanly on a repo that has only one of the two keys,
            # instead of posting a noisy "KEY is not set" comment on every review.
            case "$spec" in
              gemini|gemini:*) [ -z "${GEMINI_API_KEY:-}" ]     && { echo "Skip '$label': GEMINI_API_KEY not set."; return 0; } ;;
              *)               [ -z "${OPENROUTER_API_KEY:-}" ] && { echo "Skip '$label': OPENROUTER_API_KEY not set."; return 0; } ;;
            esac
            if already_reviewed "$label"; then
              echo "Skip: '$label' already reviewed ${SHORT_SHA:-?} with no new activity."
              return 0
            fi
            echo "Reviewer: $label"
            # Time the call and collect the slot's telemetry via a temp file (subshell-safe).
            local SLOT_META t0 t1 lat pt=0 ct=0 cost=na host=na
            SLOT_META="$(mktemp)"; export SLOT_META; t0=$SECONDS
            case "$spec" in
              gemini|gemini:*) text="$(call_gemini "$model")" ;;
              *)               text="$(call_openrouter "$model")" ;;
            esac
            t1=$SECONDS; lat=$((t1 - t0))
            # read returns non-zero on a newline-less file even after assigning; guard it so the
            # slot's subshell can't die here under set -e before post_review runs.
            [ -s "$SLOT_META" ] && { read -r pt ct cost host < "$SLOT_META" || true; }
            rm -f "$SLOT_META"; unset SLOT_META
            echo "  $label: ${lat}s, in=${pt} out=${ct} cost=${cost} host=${host}"
            post_review "$label" "$text" "$lat" "$pt" "$ct" "$cost" "$host"
          }

          # 6) Decide which slot(s) to run. A comment "@review <arg>" filters which reviewers run:
          #      (nothing) / all / both  -> every configured reviewer
          #      <keyword>               -> reviewers whose model id contains <keyword> (case-insensitive)
          #    An unmatched keyword falls back to running all (never a silent no-op).
          #    On PR-open events COMMENT_BODY is empty, so all configured reviewers run.
          FILTER="$(printf '%s' "${COMMENT_BODY:-}" | grep -ioE '@review[[:space:]]+[[:alnum:]:_./-]+' | head -1 | sed -E 's/^@review[[:space:]]+//I' | tr '[:upper:]' '[:lower:]' || true)"
          case "$FILTER" in all|both|everyone) FILTER="" ;; esac

          IFS=',' read -ra SLOTS <<< "${REVIEWERS:-gemini, z-ai/glm-5.2, minimax/minimax-m3}"
          SELECTED=()
          for spec in "${SLOTS[@]}"; do
            spec="${spec//[[:space:]]/}"; [ -z "$spec" ] && continue
            if [ -n "$FILTER" ]; then
              lc="$(printf '%s' "$spec" | tr '[:upper:]' '[:lower:]')"
              case "$lc" in *"$FILTER"*) : ;; *) continue ;; esac
            fi
            SELECTED+=("$spec")
          done
          if [ "${#SELECTED[@]}" -eq 0 ]; then
            [ -n "$FILTER" ] && echo "Filter '$FILTER' matched no configured reviewer; running all."
            for spec in "${SLOTS[@]}"; do spec="${spec//[[:space:]]/}"; [ -z "$spec" ] && continue; SELECTED+=("$spec"); done
          fi

          # Preflight: if NOT ONE selected slot has its key configured, say so once (a clear config
          # error) instead of silently posting nothing - the #1 "why did no review appear?" cause.
          # (Per-slot missing-key skips stay silent; this only fires when the whole run can't proceed.)
          RUNNABLE=0; need_or=0; need_gm=0
          for spec in "${SELECTED[@]}"; do
            case "$spec" in
              gemini|gemini:*) need_gm=1; [ -n "${GEMINI_API_KEY:-}" ]     && RUNNABLE=$((RUNNABLE+1)) ;;
              *)               need_or=1; [ -n "${OPENROUTER_API_KEY:-}" ] && RUNNABLE=$((RUNNABLE+1)) ;;
            esac
          done
          if [ "$RUNNABLE" -eq 0 ]; then
            msg="⚠️ Scrutineer is installed but no API key is configured for the selected reviewer(s)."
            [ "$need_or" = 1 ] && msg="${msg} Add the **OPENROUTER_API_KEY** secret (for OpenRouter models)."
            [ "$need_gm" = 1 ] && msg="${msg} Add the **GEMINI_API_KEY** secret (for direct Gemini)."
            msg="${msg} Repo Settings → Secrets and variables → Actions → Secrets. See the Scrutineer README."
            # Post once: skip if we've already said it on this PR, so repeated @review while the keys
            # are still being configured doesn't spam identical notices.
            # `.body // ""` again: a null body would abort the filter, jq -e would exit non-zero,
            # and the "already posted?" test would fall through to posting a duplicate notice.
            if printf '%s' "$COMMENTS_JSON" | jq -e 'map(select(.user.type=="Bot" and ((.body // "")|contains("no API key is configured"))))|length > 0' >/dev/null 2>&1; then
              echo "No runnable slot (missing keys); config notice already present - skipping."
            else
              printf '%s' "$msg" | gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file - || true
              echo "No runnable slot (missing keys); posted a config notice."
            fi
            exit 0
          fi

          # Run the selected slots in PARALLEL; wall-clock is the slowest single model, not the sum.
          pids=()
          for spec in "${SELECTED[@]}"; do run_slot "$spec" & pids+=("$!"); done
          for p in "${pids[@]}"; do wait "$p" || true; done
          echo "Done."
