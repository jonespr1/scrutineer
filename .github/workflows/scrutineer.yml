# Copy this file into a repo you want reviewed, at:
#   .github/workflows/scrutineer.yml
#
# It is the only file the target repo needs. All logic lives in the reusable workflow.
# Configure which model(s) run via that repo's Variables/Secrets (see the README).
name: 'Scrutineer'

on:
  pull_request:
    types: [opened, reopened]        # auto-review on PR open; re-review on demand via "@review"
    # Alternatives: add 'synchronize' to review on every push, or swap for
    # 'ready_for_review' to auto-review when a draft PR is marked ready.
  issue_comment:
    types: [created]

jobs:
  review:
    # Run on PR open/reopen - but skip bot-authored PRs (e.g. Dependabot); a full AI review of a
    # routine dependency bump rarely earns its cost, and you can still review one on demand with
    # "@review".
    #
    # Also runs when a trusted user comments "@review" -- but only as a WHOLE WORD ON ITS OWN
    # LINE, never merely somewhere in the body. A bare contains() fires a paid review round on
    # any comment that just discusses "@review" in prose (it happened: a comment saying it was
    # NOT triggering a round triggered one). Matching line-start rather than body-start keeps
    # the normal habit of signing off a long reply with "@review" on its own line working,
    # while an inline mention stays inert.
    #
    # BOTH ends are anchored. Anchoring only the start still fired on "@reviewer" / "@reviews",
    # so a member mentioning such a handle spent a paid round. GitHub expressions have no regex,
    # so rather than test the character after the command directly, wrap the body in newlines --
    # format('{0}{1}{0}', "\n", body) -- which turns "starts a line" into a plain contains() and
    # makes the LAST line testable too (it has no trailing newline of its own), then require what
    # follows to be a space, tab, CR (the web UI submits CRLF), LF, or one of , : . ! ? ; so
    # that natural phrasing ("@review, please look", "@review!") and a tab-separated argument
    # all still fire. "@reviewer" matches none of them - an @-handle continues with a letter,
    # digit or hyphen, and none of those is a delimiter.
    #
    # KNOWN LIMITATIONS, all consequences of there being no regex here:
    #   - @review flush-left inside a fenced code block DOES fire. A comment demonstrating the
    #     command to someone spends a round. There is no way to strip fences in an expression.
    #   - A line STARTING with "@review " fires even when it is prose about the command
    #     ("@review is the only command we support"). Only a mention later in a line is inert.
    #     Distinguishing prose from an invocation needs meaning, not matching.
    #   - Indented @review does NOT fire - inside a list item, a blockquote, or any leading
    #     whitespace. It must be flush left.
    #   - Opening a DRAFT pull request fires a review, because the trigger is on 'opened'.
    #     Swap 'opened' for 'ready_for_review' above if drafts should not be reviewed.
    #
    # Only contains() is case-insensitive (format() is a string builder, not a comparison), and
    # that is what makes "@Review" work.
    #
    # The author_association check gates the COMMENT path ONLY. It stops strangers commenting
    # "@review" to spend your API credits on a public repo. It does NOT gate the PR-open path
    # above: on a public repo, any non-bot author opening a PR fires a round. That is deliberate
    # (auto-review is the point), but know the consequence - and note GitHub withholds secrets
    # from a fork's pull_request run, so a fork PR gets the "no API key configured" notice and
    # exits 0 rather than a review. Add an author_association check to the first branch too if
    # you want the PR-open path gated. To review bot PRs automatically, drop `user.type != 'Bot'`.
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.user.type != 'Bot') ||
      (github.event.issue.pull_request != null &&
       github.event.comment.user.type != 'Bot' &&
       (contains(format('{0}{1}{0}', fromJson('"\n"'), github.event.comment.body), format('{0}@review{0}', fromJson('"\n"'))) ||
        contains(format('{0}{1}{0}', fromJson('"\n"'), github.event.comment.body), format('{0}@review{1}', fromJson('"\n"'), fromJson('"\r"'))) ||
        contains(format('{0}{1}{0}', fromJson('"\n"'), github.event.comment.body), format('{0}@review{1}', fromJson('"\n"'), fromJson('" "'))) ||
        contains(format('{0}{1}{0}', fromJson('"\n"'), github.event.comment.body), format('{0}@review,', fromJson('"\n"'))) ||
        contains(format('{0}{1}{0}', fromJson('"\n"'), github.event.comment.body), format('{0}@review:', fromJson('"\n"'))) ||
        contains(format('{0}{1}{0}', fromJson('"\n"'), github.event.comment.body), format('{0}@review.', fromJson('"\n"'))) ||
        contains(format('{0}{1}{0}', fromJson('"\n"'), github.event.comment.body), format('{0}@review!', fromJson('"\n"'))) ||
        contains(format('{0}{1}{0}', fromJson('"\n"'), github.event.comment.body), format('{0}@review?', fromJson('"\n"'))) ||
        contains(format('{0}{1}{0}', fromJson('"\n"'), github.event.comment.body), format('{0}@review;', fromJson('"\n"'))) ||
        contains(format('{0}{1}{0}', fromJson('"\n"'), github.event.comment.body), format('{0}@review{1}', fromJson('"\n"'), fromJson('"\t"')))) &&
       contains(fromJson('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    # The reusable workflow inherits exactly these grants. 'checks: read' powers CI-aware
    # severity calibration; it is optional (reviews run fine without it).
    permissions:
      contents: 'read'
      issues: 'write'
      checks: 'read'
      pull-requests: 'write'
    # Pin to a tag (recommended) or a commit SHA rather than @main.
    uses: 'jonespr1/scrutineer/.github/workflows/review.yml@v1'
    # Explicit secrets, NOT "secrets: inherit" -- inherit hands the called workflow
    # every repo secret and trips SAST / secret-scan gates. review.yml declares
    # exactly these two under on.workflow_call.secrets.
    secrets:
      GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}'
      OPENROUTER_API_KEY: '${{ secrets.OPENROUTER_API_KEY }}'
