# Copy this file into a repo you want reviewed, at:
#   .github/workflows/scrutineer.yml
#
# It is the only file the target repo needs. All logic lives in the reusable workflow.
# Configure which model(s) run via that repo's Variables/Secrets (see the README).
name: 'Scrutineer'

on:
  pull_request:
    types: [opened, reopened]        # auto-review on PR open; re-review on demand via "@review"
    # Alternatives: add 'synchronize' to review on every push, or swap for
    # 'ready_for_review' to auto-review when a draft PR is marked ready.
  issue_comment:
    types: [created]

jobs:
  review:
    # Run on PR open/reopen - but skip bot-authored PRs (e.g. Dependabot); a full AI review of
    # a routine dependency bump rarely earns its cost, and you can still review one on demand
    # with "@review".
    #
    # THIS FILE SHOULD NEVER NEED CHANGING AGAIN. That is deliberate, and it was learned the hard
    # way: the precise "@review" matcher used to live in this expression, and moving one delimiter
    # meant a pull request in every consumer repo. The condition below is now only a cheap
    # PREFILTER - it fires on any comment containing "@review" anywhere, which is intentionally
    # generous. The real rule (line-anchored, whole-word, with its delimiter set and its
    # documented limitations) lives in review.yml and reaches you through the @v1 tag, so
    # tightening it is a release rather than fifteen pull requests.
    #
    # The cost of the prefilter being generous: a comment merely DISCUSSING "@review" starts a
    # runner, which then exits in a few seconds without calling any model. Runner seconds, not
    # API credits. That is the trade for never having to touch this file.
    #
    # The four things below genuinely cannot be centralised: GitHub requires the workflow file in
    # your repo, a called workflow cannot grant itself permissions, secrets must be passed
    # explicitly, and the pin is the reference.
    #
    # The author_association check gates the COMMENT path ONLY. It stops strangers commenting
    # "@review" to spend your API credits on a public repo. It does NOT gate the PR-open path: on
    # a public repo, any non-bot author opening a PR fires a round. That is deliberate
    # (auto-review is the point), but know the consequence - and note GitHub withholds secrets
    # from a fork's pull_request run, so a fork PR gets the "no API key configured" notice and
    # exits 0 rather than a review. Add an author_association check to the first branch too if
    # you want the PR-open path gated. To review bot PRs automatically, drop `user.type != 'Bot'`.
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.user.type != 'Bot') ||
      (github.event.issue.pull_request != null &&
       github.event.comment.user.type != 'Bot' &&
       contains(github.event.comment.body, '@review') &&
       contains(fromJson('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    # The reusable workflow inherits exactly these grants. 'checks: read' powers CI-aware
    # severity calibration; it is optional (reviews run fine without it).
    permissions:
      contents: 'read'
      issues: 'write'
      checks: 'read'
      pull-requests: 'write'
    # Pin to a tag (recommended) or a commit SHA rather than @main.
    uses: 'jonespr1/scrutineer/.github/workflows/review.yml@v1'
    # Explicit secrets, NOT "secrets: inherit" -- inherit hands the called workflow
    # every repo secret and trips SAST / secret-scan gates. review.yml declares
    # exactly these two under on.workflow_call.secrets.
    secrets:
      GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}'
      OPENROUTER_API_KEY: '${{ secrets.OPENROUTER_API_KEY }}'
